name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2019
            target: windows
            artifact_name: FanxingStudyFlow-windows7-win11-x64
            build_cmd: pwsh scripts/build_windows_app.ps1
            artifact_path: release/FanxingStudyFlow-windows7-win11-x64.zip
          - os: macos-13
            target: macos
            artifact_name: FanxingStudyFlow-macos10.13-x64
            build_cmd: bash scripts/build_macos_app.sh
            artifact_path: release/FanxingStudyFlow-macos10.13-x64.tar.gz
          - os: ubuntu-20.04
            target: linux
            artifact_name: FanxingStudyFlow-linux-x64
            build_cmd: bash scripts/build_linux_app.sh
            artifact_path: release/FanxingStudyFlow-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x64

      - name: Build ${{ matrix.target }} package
        run: ${{ matrix.build_cmd }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FanxingStudyFlow-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
