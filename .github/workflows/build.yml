name: Build and Release

run-name: >-
  Build ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'release' }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - macos
          - all

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'release' }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      artifact_pattern: FanxingStudyFlow-*

    steps:
      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            linux)
              matrix='{"include":[{"os":"ubuntu-22.04","target":"linux","artifact_name":"FanxingStudyFlow-linux-x64","build_cmd":"bash scripts/build_linux_app.sh","artifact_path":"release/FanxingStudyFlow-linux-x64.tar.gz"}]}'
              ;;
            windows)
              matrix='{"include":[{"os":"windows-2022","target":"windows","artifact_name":"FanxingStudyFlow-windows7-win11-x64","build_cmd":"pwsh scripts/build_windows_app.ps1","artifact_path":"release/FanxingStudyFlow-windows7-win11-x64.zip"}]}'
              ;;
            macos)
              matrix='{"include":[{"os":"macos-15-intel","target":"macos","artifact_name":"FanxingStudyFlow-macos10.13-x64","build_cmd":"bash scripts/build_macos_app.sh","artifact_path":"release/FanxingStudyFlow-macos10.13-x64.tar.gz"}]}'
              ;;
            all)
              matrix='{"include":[{"os":"ubuntu-22.04","target":"linux","artifact_name":"FanxingStudyFlow-linux-x64","build_cmd":"bash scripts/build_linux_app.sh","artifact_path":"release/FanxingStudyFlow-linux-x64.tar.gz"},{"os":"windows-2022","target":"windows","artifact_name":"FanxingStudyFlow-windows7-win11-x64","build_cmd":"pwsh scripts/build_windows_app.ps1","artifact_path":"release/FanxingStudyFlow-windows7-win11-x64.zip"},{"os":"macos-15-intel","target":"macos","artifact_name":"FanxingStudyFlow-macos10.13-x64","build_cmd":"bash scripts/build_macos_app.sh","artifact_path":"release/FanxingStudyFlow-macos10.13-x64.tar.gz"}]}'
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/*.txt

      - name: Build ${{ matrix.target }} package
        run: ${{ matrix.build_cmd }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare.outputs.artifact_pattern }}
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
