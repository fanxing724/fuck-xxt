name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: ''
            archive_cmd: tar -czf "../fuck-xxt-linux.tar.gz" "fuck-xxt-linux"
          - os: macos-13
            target: macos
            ext: ''
            extra_env: MACOSX_DEPLOYMENT_TARGET=10.13
            pyinstaller_args: --target-architecture x86_64
            archive_cmd: tar -czf "../fuck-xxt-macos.tar.gz" "fuck-xxt-macos"
          - os: windows-2019
            target: windows
            ext: .exe
            extra_env: ''
            pyinstaller_args: ''
            archive_cmd: 7z a -tzip "../fuck-xxt-windows.zip" "fuck-xxt-windows.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        env: ${{ matrix.extra_env }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        env: ${{ matrix.extra_env }}
        run: |
          pyinstaller --clean --noconfirm `
            --name "fuck-xxt-${{ matrix.target }}" `
            --onefile `
            --add-data "app;app" `
            --add-data "config;config" `
            --collect-all "app" `
            ${{ matrix.pyinstaller_args }} `
            launcher.py
        shell: pwsh

      - name: Create archive
        run: |
          cd dist
          ${{ matrix.archive_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuck-xxt-${{ matrix.target }}
          path: dist/../fuck-xxt-${{ matrix.target }}.*
          if-no-files-found: warn

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fuck-xxt-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          generate_release_notes: true
